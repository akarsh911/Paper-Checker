services:
  paper-checker:
    build:
      context: .
      dockerfile: Dockerfile
    image: paper-checker:latest
    ports:
      - "9000:8081"          # host 9000 -> container 8081
    env_file:
      - .env                  # GEMINI_API_KEY, JWT_SECRET, GEMINI_MODEL
    environment:
      PORT: "8081"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/app/data/paper-checker.db
      SEED_DEMO_DATA: "true"
    volumes:
      - paper_checker_data:/app/data
      - paper_checker_uploads:/app/uploads
    restart: unless-stopped

volumes:
  paper_checker_data:
  paper_checker_uploads:
